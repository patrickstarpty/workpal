[project]
name = "workpal-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "redis",
    "pydantic-settings",
    "pytest",
    "httpx",
    "pyjwt>=2.15.1",
    "wsproto>=1.3.2",
    "python-multipart>=0.0.34",
    "cryptography>=50.0.2",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.hatch.build.targets.wheel]
packages = ["src/workpal_backend"]
[tool.hatch.build]
dev-mode-dirs = ["src"]
