<title>Workpal capability home</title>
<style id="workpal-foundation">:root {
    --text-micro: calc(11px * var(--font-scale, 1));
    --text-micro--line-height: calc(15px * var(--font-scale, 1));
    --text-caption: calc(12px * var(--font-scale, 1));
    --text-caption--line-height: calc(16px * var(--font-scale, 1));
    --text-label: calc(13px * var(--font-scale, 1));
    --text-label--line-height: calc(18px * var(--font-scale, 1));
    --text-body: calc(14px * var(--font-scale, 1));
    --text-body--line-height: calc(20px * var(--font-scale, 1));
    --text-body-lg: calc(15px * var(--font-scale, 1));
    --text-body-lg--line-height: calc(22px * var(--font-scale, 1));
    --text-title-sm: calc(16px * var(--font-scale, 1));
    --text-title-sm--line-height: calc(24px * var(--font-scale, 1));
    --text-title: calc(18px * var(--font-scale, 1));
    --text-title--line-height: calc(28px * var(--font-scale, 1));
    --text-title-lg: calc(20px * var(--font-scale, 1));
    --text-title-lg--line-height: calc(28px * var(--font-scale, 1));
    --text-display-sm: calc(24px * var(--font-scale, 1));
    --text-display-sm--line-height: calc(32px * var(--font-scale, 1));
    --text-display: calc(36px * var(--font-scale, 1));
    --text-display--line-height: calc(40px * var(--font-scale, 1));
}

:root {
    --dialog-enter-duration: 100ms;
    --dialog-exit-duration: 100ms;

    --dialog-exit-easing: ease;

    color-scheme: light;
    --button-height-xs: 1.5rem;

    --button-height-default: 2rem;
    --button-height-lg: 2.25rem;

    --ring: oklch(0.705 0.015 286.067);

    --sidebar: oklch(0.964435 0.001327 286.375);
    --sidebar-foreground: oklch(0.141 0.005 285.823);
    --sidebar-primary: oklch(0.21 0.006 285.885);
    --sidebar-primary-foreground: oklch(0.985 0 0);
    --sidebar-accent: oklch(0.935 0.003 286.375);
    --sidebar-accent-foreground: oklch(0.21 0.006 285.885);
    --sidebar-border: oklch(0.92 0.004 286.32);
    --sidebar-ring: oklch(0.705 0.015 286.067);
    --brand: oklch(0.56079497 0.19449888 256.41258418);
    --brand-foreground: oklch(0.985 0 0);
    --workpal-ink: #0b0b0c;
    --workpal-paper: #ffffff;
    --success: oklch(0.55 0.16 145);
    --warning: oklch(0.75 0.16 85);
    --info: oklch(0.55 0.18 250);

    --find-match-foreground: oklch(0.22 0.03 92);

@media (min-width: 48rem) {
    :root {
        --chat-launcher-clearance: 0px;
    }
}

 :root{--font-ui-inter:"Workpal Inter",Inter;--font-sans:var(--font-ui,var(--font-ui-inter)),ui-sans-serif,system-ui,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;color:var(--foreground);font-family:Inter,var(--font-sans),sans-serif}
#workpal-concept{font-size:var(--text-body);line-height:var(--text-body--line-height);line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
button:disabled{cursor:default}
.masthead{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:8px 0 18px;border-bottom:1px solid var(--border)}
.brand{font-size:var(--text-title-lg);line-height:var(--text-title-lg--line-height);font-weight:600;letter-spacing:-.8px;border:0;background:transparent;padding:0}
.nav{display:flex;gap:18px;align-items:center;flex:1}
.nav button{background:transparent;border:0;padding:7px 0;font-size:var(--text-caption);line-height:var(--text-caption--line-height);color:var(--muted-foreground)}
.nav button[aria-current=page]{color:var(--foreground);box-shadow:0 1px currentColor}
.primary{border:1px solid var(--foreground);background:var(--foreground);color:var(--background);padding:9px 13px;border-radius:var(--radius);font-size:var(--text-caption);line-height:var(--text-caption--line-height);white-space:nowrap}
.plain{border:1px solid var(--border);background:var(--card);padding:8px 12px;border-radius:var(--radius);font-size:var(--text-caption);line-height:var(--text-caption--line-height)}
.link{border:0;background:transparent;padding:0;text-align:left;font-size:var(--text-caption);line-height:var(--text-caption--line-height);font-weight:500}
.hero{padding:30px 0 24px;max-width:620px}
.eyebrow{font-size:var(--text-micro);line-height:var(--text-micro--line-height);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground);margin:0 0 9px}
h1,h2,h3,p{margin:0}
h1{font-size:var(--text-display);line-height:var(--text-display--line-height);letter-spacing:-1.5px;line-height:1.15;font-weight:500}
h2{font-size:var(--text-title-lg);line-height:var(--text-title-lg--line-height);line-height:1.3;letter-spacing:-.5px;font-weight:500}
h3{font-size:var(--text-body-lg);line-height:var(--text-body-lg--line-height);font-weight:500}
.subtitle{color:var(--muted-foreground);margin-top:11px;max-width:580px}
.scenario{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:0 0 16px}
.tag{font-size:var(--text-micro);line-height:var(--text-micro--line-height);color:var(--muted-foreground);border:1px solid var(--border);border-radius:var(--radius);padding:3px 7px;white-space:nowrap}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-bottom:10px}
.stage{border:0;border-bottom:2px solid var(--border);background:transparent;padding:10px 3px;font-size:var(--text-caption);line-height:var(--text-caption--line-height);text-align:left}
.stage[aria-pressed=true]{border-color:var(--foreground);font-weight:600}
.feedback{font-size:var(--text-micro);line-height:var(--text-micro--line-height);color:var(--muted-foreground);margin-bottom:18px}
.panel{padding:16px;background:var(--card);border-radius:var(--radius)}
.stage-detail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
.section-description{font-size:var(--text-label);line-height:var(--text-label--line-height);color:var(--muted-foreground);margin-top:9px}
.facts{display:grid;gap:14px;margin-top:20px}
.label{font-size:var(--text-micro);line-height:var(--text-micro--line-height);color:var(--muted-foreground);display:block;margin-bottom:4px}
.value{font-size:var(--text-label);line-height:var(--text-label--line-height)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:var(--text-micro);line-height:var(--text-micro--line-height);background:var(--secondary);color:var(--secondary-foreground);padding:3px 7px;border-radius:var(--radius);border:0}
.paper{padding-left:20px;border-left:1px solid var(--border)}
.filename{font-family:var(--font-mono),monospace;font-size:var(--text-body-lg);line-height:var(--text-body-lg--line-height);margin-bottom:14px}
.outline{display:grid;gap:12px}
.outline p{font-size:var(--text-caption);line-height:var(--text-caption--line-height);color:var(--muted-foreground);margin-top:2px}
.outline h3{font-size:var(--text-caption);line-height:var(--text-caption--line-height)}
.decision{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:16px;margin-top:18px;border-top:1px solid var(--border)}
.teasers{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
.teaser{border-top:1px solid var(--border);padding-top:17px;display:grid;gap:9px;align-content:start}

how to use Claude or a Claude product — it recommends matching courses, tutorials, and use cases from Claude Academy (academy.claude.com), Anthropic's learning hub. Trigger on: \"how do I\", \"how can I\", \"getting started with\", \"what can Claude do\", \"teach me\", \"learn to use\"; questions about artifacts, projects, skills, plugins, connectors, MCP; requests about rolling Claude out to a team, class, or organization; and any ask for training materials, onboarding content, or learning resources. Use it when the user is learning how to use a feature or product — not when they are mid-task and just want the task done. This skill composes with other skills: after consulting product documentation to answer how a Claude feature works, also check here for a matching course or tutorial — a docs-grounded answer and an Academy recommendation belong together. Only recommend on a strong match; never invent Academy content.\n","path":"skills/academy-guide/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/academy-guide/SKILL.md","blobSha":"cefeaeb20cc29a803af0335d7c7155b066d8770f","scope":"skill","types":["knowledge"]},{"id":"anthropic:skills/algorithmic-art/SKILL.md","name":"algorithmic-art","description":"Creating algorithmic art using p5.js with seeded randomness and interactive parameter exploration. Use this when users request creating art using code, generative art, algorithmic art, flow fields, or particle systems. Create original algorithmic art rather than copying existing artists' work to avoid copyright violations.","path":"skills/algorithmic-art/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/algorithmic-art/SKILL.md","blobSha":"634f6fa42e4e697fa6afd293acd7fb8246574876","scope":"skill","types":["design"]},{"id":"anthropic:skills/brand-guidelines/SKILL.md","name":"brand-guidelines","description":"Applies Anthropic's official brand colors and typography to any sort of artifact that may benefit from having Anthropic's look-and-feel. Use it when brand colors or style guidelines, visual formatting, or company design standards apply.","path":"skills/brand-guidelines/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/brand-guidelines/SKILL.md","blobSha":"47c72c607bdb5dd81bdea5de2b5e4f3992a5fd59","scope":"skill","types":["design"]},{"id":"anthropic:skills/canvas-design/SKILL.md","name":"canvas-design","description":"Create beautiful visual art in .png and .pdf documents using design philosophy. You should use this skill when the user asks to create a poster, piece of art, design, or other static piece. Create original visual designs, never copying existing artists' work to avoid copyright violations.","path":"skills/canvas-design/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/canvas-design/SKILL.md","blobSha":"9f63fee82de84cd4230e1d0e322247b61eb4c94c","scope":"skill","types":["design"]},{"id":"anthropic:skills/claude-api/SKILL.md","name":"claude-api","description":"Reference for the Claude API / Anthropic SDK — model ids, pricing, params, streaming, tool use, MCP, agents, caching, token counting, model migration.\nTRIGGER — read BEFORE opening the target file; don't skip because it \"looks like a one-liner\" — whenever: the prompt names Claude/Anthropic in any form (Claude, Anthropic, Fable, Opus, Sonnet, Haiku, `anthropic`, `@anthropic-ai`, `claude-*`, `us.anthropic.*`, `[1m]`); the user asks about an LLM (pricing/model choice/limits/caching) — never answer from memory; OR the task is LLM-shaped with provider unstated (agent/MCP/tool-definition/multi-agent/RAG/LLM-judge/computer-use; generate/summarize/extract/classify/rewrite/converse over NL; debugging refusals/cutoffs/streaming/tool-calls/tokens).\nSKIP only when another provider is being worked on (overrides all triggers): OpenAI/GPT/Gemini/Llama/Mistral/Cohere/Ollama named in the query; OR `grep -rE 'openai|langchain_openai|google.generativeai|genai|mistralai|cohere|ollama'` over the project hits (run this grep FIRST if no provider named — don't Read the file).","path":"skills/claude-api/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/claude-api/SKILL.md","blobSha":"fe7e28a55c713933ff98e017112e53c61d8f5537","scope":"skill","types":["engineering"]},{"id":"anthropic:skills/discernment-nudge/SKILL.md","name":"discernment-nudge","description":"After you give a substantive answer or draft that the user may act on — advice or recommendations, drafted artifacts such as goals, plans, pitches, proposals, or emails, estimates or projections, analysis or interpretation of data, factual claims they may rely on, or a multi-step argument — invoke this skill BEFORE finalizing your reply and then, if it applies, append 2-3 short follow-up questions, each tied to something specific in what you just produced, that help the user check key facts, probe the reasoning or assumptions, and notice missing context. Do this at most once per conversation. Skip it when the user asked a trivial how-to or simple lookup, wants a purely educational explanation, asked you only to format, convert, or assemble a file from content they provided, is writing code they will run, is doing creative writing or casual chat, or already asked you to double-check, cite, or review — the skill file explains these boundaries and the exact output format.\n","path":"skills/discernment-nudge/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/discernment-nudge/SKILL.md","blobSha":"49ebbcad692ffdf70e518087468609a5c4ab9e22","scope":"skill","types":["quality"]},{"id":"anthropic:skills/doc-coauthoring/SKILL.md","name":"doc-coauthoring","description":"Guide users through a structured workflow for co-authoring documentation. Use when user wants to write documentation, proposals, technical specs, decision docs, or similar structured content. This workflow helps users efficiently transfer context, refine content through iteration, and verify the doc works for readers. Trigger when user mentions writing docs, creating proposals, drafting specs, or similar documentation tasks.","path":"skills/doc-coauthoring/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/doc-coauthoring/SKILL.md","blobSha":"a5a69839ef4a161131d80b6daef10037a9686f4a","scope":"skill","types":["documents","knowledge"]},{"id":"anthropic:skills/docx/SKILL.md","name":"docx","description":"Use this skill whenever the user wants to create, read, edit, or manipulate Word documents (.docx files) or Word templates (.dotx files). Triggers include: any mention of 'Word doc', 'word document', '.docx', '.dotx', or requests to produce professional documents with formatting like tables of contents, headings, page numbers, or letterheads. Also use when extracting or reorganizing content from .docx or .dotx files, inserting or replacing images in documents, performing find-and-replace in Word files, working with tracked changes or comments, or converting content into a polished Word document. If the user asks for a 'report', 'memo', 'letter', 'template', or similar deliverable as a Word or .docx file, use this skill. Do NOT use for PDFs, spreadsheets, Google Docs, or general coding tasks unrelated to document generation.","path":"skills/docx/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/docx/SKILL.md","blobSha":"a95379e1bb058bbca8c51edbd30de4d31ae4785b","scope":"skill","types":["documents"]},{"id":"anthropic:skills/frontend-design/SKILL.md","name":"frontend-design","description":"Guidance for distinctive, intentional visual design when building new UI or reshaping an existing one. Helps with aesthetic direction, typography, and making choices that don't read as templated defaults.","path":"skills/frontend-design/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/frontend-design/SKILL.md","blobSha":"a5333457c414d20d625f307df945842c0952ecc3","scope":"skill","types":["design"]},{"id":"anthropic:skills/internal-comms/SKILL.md","name":"internal-comms","description":"A set of resources to help me write all kinds of internal communications, using the formats that my company likes to use. Claude should use this skill whenever asked to write some sort of internal communications (status reports, leadership updates, 3P updates, company newsletters, FAQs, incident reports, project updates, etc.).","path":"skills/internal-comms/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/internal-comms/SKILL.md","blobSha":"56ea935b74f371bfeb4c7d3c19d5139df866e73b","scope":"skill","types":["knowledge"]},{"id":"anthropic:skills/mcp-builder/SKILL.md","name":"mcp-builder","description":"Guide for creating high-quality MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. Use when building MCP servers to integrate external APIs or services, whether in Python (FastMCP) or Node/TypeScript (MCP SDK).","path":"skills/mcp-builder/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/mcp-builder/SKILL.md","blobSha":"d61a9056202a0f8b2d064c896e62f415c45b1bf1","scope":"skill","types":["engineering","automation"]},{"id":"anthropic:skills/pdf/SKILL.md","name":"pdf","description":"Use this skill whenever the user wants to do anything with PDF files. This includes reading or extracting text/tables from PDFs, combining or merging multiple PDFs into one, splitting PDFs apart, rotating pages, adding watermarks, creating new PDFs, filling PDF forms, encrypting/decrypting PDFs, extracting images, and OCR on scanned PDFs to make them searchable. If the user mentions a .pdf file or asks to produce one, use this skill.","path":"skills/pdf/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/pdf/SKILL.md","blobSha":"9f606f1cd68dcab9dabb75b548e90c1de028b8a2","scope":"skill","types":["documents"]},{"id":"anthropic:skills/pptx/SKILL.md","name":"pptx","description":"Use this skill any time a .pptx or .potx file is involved in any way — as input, output, or both. This includes: creating slide decks, pitch decks, or presentations; reading, parsing, or extracting text from any .pptx or .potx file (even if the extracted content will be used elsewhere, like in an email or summary); editing, modifying, or updating existing presentations; combining or splitting slide files; working with templates (.potx), layouts, speaker notes, or comments. Trigger whenever the user mentions \"deck,\" \"slides,\" \"presentation,\" or references a .pptx or .potx filename, regardless of what they plan to do with the content afterward. If a .pptx or .potx file needs to be opened, created, or touched, use this skill.","path":"skills/pptx/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/pptx/SKILL.md","blobSha":"6857031b6d9942039b9fe1871887910e8f5c5ff5","scope":"skill","types":["documents"]},{"id":"anthropic:skills/skill-creator/SKILL.md","name":"skill-creator","description":"Create new skills, modify and improve existing skills, and measure skill performance. Use when users want to create a skill from scratch, edit, or optimize an existing skill, run evals to test a skill, benchmark skill performance with variance analysis, or optimize a skill's description for better triggering accuracy.","path":"skills/skill-creator/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/skill-creator/SKILL.md","blobSha":"65b3a402dbd09b8e83f9d637c6b553875189085c","scope":"skill","types":["skill-authoring","quality"]},{"id":"anthropic:skills/slack-gif-creator/SKILL.md","name":"slack-gif-creator","description":"Knowledge and utilities for creating animated GIFs optimized for Slack. Provides constraints, validation tools, and animation concepts. Use when users request animated GIFs for Slack like \"make me a GIF of X doing Y for Slack.\"","path":"skills/slack-gif-creator/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/slack-gif-creator/SKILL.md","blobSha":"16660d8ceb77af47986bba1c9176c2ff3f287a91","scope":"skill","types":["design"]},{"id":"anthropic:skills/theme-factory/SKILL.md","name":"theme-factory","description":"Toolkit for styling artifacts with a theme. These artifacts can be slides, docs, reportings, HTML landing pages, etc. There are 10 pre-set themes with colors/fonts that you can apply to any artifact that has been creating, or can generate a new theme on-the-fly.","path":"skills/theme-factory/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/theme-factory/SKILL.md","blobSha":"90dfceaf2ecdc191a4dcfb0069768a9560638998","scope":"skill","types":["design"]},{"id":"anthropic:skills/web-artifacts-builder/SKILL.md","name":"web-artifacts-builder","description":"Suite of tools for creating elaborate, multi-component claude.ai HTML artifacts using modern frontend web technologies (React, Tailwind CSS, shadcn/ui). Use for complex artifacts requiring state management, routing, or shadcn/ui components - not for simple single-file HTML/JSX artifacts.","path":"skills/web-artifacts-builder/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/web-artifacts-builder/SKILL.md","blobSha":"8b39b19f259b4216ecb07574741dd8eaa9863a07","scope":"skill","types":["engineering"]},{"id":"anthropic:skills/webapp-testing/SKILL.md","name":"webapp-testing","description":"Toolkit for interacting with and testing local web applications using Playwright. Supports verifying frontend functionality, debugging UI behavior, capturing browser screenshots, and viewing browser logs.","path":"skills/webapp-testing/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/webapp-testing/SKILL.md","blobSha":"4726215301db64a0cc4d41fc3219c61f37a30f4a","scope":"skill","types":["quality"]},{"id":"anthropic:skills/xlsx/SKILL.md","name":"xlsx","description":"Use this skill any time a spreadsheet file is the primary input or output. This means any task where the user wants to: open, read, edit, or fix an existing .xlsx, .xlsm, .xltx, .csv, or .tsv file (e.g., adding columns, computing formulas, formatting, charting, cleaning messy data); create a new spreadsheet from scratch or from other data sources; or convert between tabular file formats. Trigger especially when the user references a spreadsheet file by name or path — even casually (like \"the xlsx in my downloads\") — and wants something done to it or produced from it. Also trigger for cleaning or restructuring messy tabular data files (malformed rows, misplaced headers, junk data) into proper spreadsheets. The deliverable must be a spreadsheet file. Do NOT trigger when the primary deliverable is a Word document, HTML report, standalone Python script, database pipeline, or Google Sheets API integration, even if tabular data is involved.","path":"skills/xlsx/SKILL.md","url":"https://github.com/anthropics/skills/blob/e4bb5d960d87126ff3b3a8af1a104b7db67560ba/skills/xlsx/SKILL.md","blobSha":"419ecd344b776826107eef93a9727af3772cb755","scope":"skill","types":["documents"]},{"id":"superpowers:skills/brainstorming/SKILL.md","name":"brainstorming","description":"You MUST use this before any creative work - creating features, building components, adding functionality, modifying behavior, or planning anything new, in software or out of it (a talk, a business, a renovation).","path":"skills/brainstorming/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/brainstorming/SKILL.md","blobSha":"9eb0edc7fedf26e1d3e2f3f223e5bcc5058aed6a","scope":"skill","types":["planning"]},{"id":"superpowers:skills/diagnosing-superpowers/SKILL.md","name":"diagnosing-superpowers","description":"Use when a superpowers session went wrong and your human partner wants to know why — repeated work, ignored plans, stumbles, poor results, a skill that didn't fire, \"it took too long\", \"why is it so expensive\", \"what is it doing\" — or wants to build a bug report for the superpowers maintainers, for the current session or a past one identified by id or path, on any harness.","path":"skills/diagnosing-superpowers/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/diagnosing-superpowers/SKILL.md","blobSha":"dda2692d528574c410b118a6de545d6afc7eb047","scope":"skill","types":["research","quality"]},{"id":"superpowers:skills/dispatching-parallel-agents/SKILL.md","name":"dispatching-parallel-agents","description":"Use when facing 2+ independent tasks that can be worked on without shared state or sequential dependencies","path":"skills/dispatching-parallel-agents/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/dispatching-parallel-agents/SKILL.md","blobSha":"3fa091b348bbe0a18eaa0e17e9092c97f7005cbe","scope":"skill","types":["automation"]},{"id":"superpowers:skills/executing-plans/SKILL.md","name":"executing-plans","description":"Use when executing an implementation plan in the current session as the implementer yourself — your human partner chose inline execution, or no subagent tool is available","path":"skills/executing-plans/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/executing-plans/SKILL.md","blobSha":"ea23196d745043eefb0287387112825d2ca99f05","scope":"skill","types":["engineering"]},{"id":"superpowers:skills/finishing-a-development-branch/SKILL.md","name":"finishing-a-development-branch","description":"Use when implementation is complete, all tests pass, and you need to decide how to integrate the work","path":"skills/finishing-a-development-branch/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/finishing-a-development-branch/SKILL.md","blobSha":"fa8aecaf8813f1b19d19996f7957d1b0121f2d9c","scope":"skill","types":["operations"]},{"id":"superpowers:skills/receiving-code-review/SKILL.md","name":"receiving-code-review","description":"Use when receiving code review feedback, before implementing suggestions, especially if feedback seems unclear or technically questionable - requires technical rigor and verification, not performative agreement or blind implementation","path":"skills/receiving-code-review/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/receiving-code-review/SKILL.md","blobSha":"950da7b74bf6dbed6b8726d12ddadd65a9f5fda7","scope":"skill","types":["quality"]},{"id":"superpowers:skills/requesting-code-review/SKILL.md","name":"requesting-code-review","description":"Use when completing tasks, implementing major features, or before merging to verify work meets requirements","path":"skills/requesting-code-review/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/requesting-code-review/SKILL.md","blobSha":"68d338a58ecdd8b77bfbb519b781ef223dbbb842","scope":"skill","types":["quality"]},{"id":"superpowers:skills/subagent-driven-development/SKILL.md","name":"subagent-driven-development","description":"Use when executing implementation plans with independent tasks in the current session","path":"skills/subagent-driven-development/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/subagent-driven-development/SKILL.md","blobSha":"45195787cb3f5d141af203e2fdc12f158be14522","scope":"skill","types":["engineering","automation"]},{"id":"superpowers:skills/systematic-debugging/SKILL.md","name":"systematic-debugging","description":"Use when encountering any bug, test failure, or unexpected behavior, before proposing fixes","path":"skills/systematic-debugging/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/systematic-debugging/SKILL.md","blobSha":"62fc752aaef59a8bbed5d305f4cadc60f8ae07ed","scope":"skill","types":["engineering","quality"]},{"id":"superpowers:skills/test-driven-development/SKILL.md","name":"test-driven-development","description":"Use when implementing any feature or bugfix, before writing implementation code","path":"skills/test-driven-development/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/test-driven-development/SKILL.md","blobSha":"46838cc9e893c06259e3bdad0fc2425b36242f15","scope":"skill","types":["engineering","quality"]},{"id":"superpowers:skills/using-git-worktrees/SKILL.md","name":"using-git-worktrees","description":"Use when starting feature work that needs isolation from current workspace or before executing implementation plans - ensures an isolated workspace exists via native tools or git worktree fallback","path":"skills/using-git-worktrees/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/using-git-worktrees/SKILL.md","blobSha":"1381dacb3516b94382dd6ec736ede21ee8ede2b3","scope":"skill","types":["engineering"]},{"id":"superpowers:skills/using-superpowers/SKILL.md","name":"using-superpowers","description":"Use when starting any conversation - establishes how to find and use skills, requiring skill invocation before ANY response including clarifying questions","path":"skills/using-superpowers/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/using-superpowers/SKILL.md","blobSha":"069d578445805a28b8dacbf70cdf045e1673def0","scope":"skill","types":["automation"]},{"id":"superpowers:skills/verification-before-completion/SKILL.md","name":"verification-before-completion","description":"Use when about to claim work is complete, fixed, or passing, before committing or creating PRs - requires running verification commands and confirming output before making any success claims; evidence before assertions always","path":"skills/verification-before-completion/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/verification-before-completion/SKILL.md","blobSha":"7d45333cc4a49c57a80df6c1fe2fa777a207afbc","scope":"skill","types":["quality","principles"]},{"id":"superpowers:skills/writing-plans/SKILL.md","name":"writing-plans","description":"Use when you have a spec or requirements for a multi-step task, before touching code","path":"skills/writing-plans/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/writing-plans/SKILL.md","blobSha":"4cf0275d88d67aa4ef09f4bbca9970ed6ff74a00","scope":"skill","types":["planning"]},{"id":"superpowers:skills/writing-skills/SKILL.md","name":"writing-skills","description":"Use when creating new skills, editing existing skills, or verifying skills work before deployment","path":"skills/writing-skills/SKILL.md","url":"https://github.com/obra/superpowers/blob/22f0b463e7a5e579904dd6211a520321035526f7/skills/writing-skills/SKILL.md","blobSha":"09d76b79dd4080fe4dcc9bfb3c54d05dbff8a563","scope":"skill","types":["skill-authoring","quality"]},{"id":"pstack:pstack/automations/benny/skills/reproduce-and-fix-issues/SKILL.md","name":"reproduce-and-fix-issues","description":"Reproduce triaged Slack bugs through a configured app-control adapter, verify existing fixes, and open a bounded draft pull request only after before-and-after proof. Use only from the configured Benny repro automation.","path":"pstack/automations/benny/skills/reproduce-and-fix-issues/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/automations/benny/skills/reproduce-and-fix-issues/SKILL.md","blobSha":"4217748c59f599c4763a0f436ad8a123f6ce3681","scope":"automation","categoryHint":"Benny automation","types":["quality","engineering","automation"]},{"id":"pstack:pstack/automations/benny/skills/setup-benny/SKILL.md","name":"setup-benny","description":"Configure Benny and prepare its triage and repro automations. Use when installing Benny or changing its Slack, tracker, repository, routing, control, model, or budget settings.","path":"pstack/automations/benny/skills/setup-benny/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/automations/benny/skills/setup-benny/SKILL.md","blobSha":"8e65a6c8c6cafdf257148fb3c8a1699e02e12c07","scope":"automation","categoryHint":"Benny automation","types":["automation"]},{"id":"pstack:pstack/automations/benny/skills/triage-issue-reports/SKILL.md","name":"triage-issue-reports","description":"Triage Slack issue reports with one thread-only verdict, evidence review, cause-aware routing, tracker dedupe, and fail-closed ticket creation. Use only from the configured Benny triage automation.","path":"pstack/automations/benny/skills/triage-issue-reports/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/automations/benny/skills/triage-issue-reports/SKILL.md","blobSha":"93c138d2378cff1cdc4f8a9c01e651eb627b626c","scope":"automation","categoryHint":"Benny automation","types":["operations","automation"]},{"id":"pstack:pstack/skills/architect/SKILL.md","name":"architect","description":"Sketch types, signatures, and module structure before code, then stay in the loop while implementation fills in. Use for /architect, 'architect this', 'design this', or non-trivial work where jumping to code would lock in the wrong shape.","path":"pstack/skills/architect/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/architect/SKILL.md","blobSha":"0c1a1338ff46497bf9086abab9dd9c44d244cd66","scope":"skill","types":["engineering","planning"]},{"id":"pstack:pstack/skills/arena/SKILL.md","name":"arena","description":"Spawn N parallel candidates at the same task, pick a base, graft the strongest parts of the losers into it. Use for /arena, 'arena this', 'throw it in the arena', or when one attempt at a non-trivial artifact would lock in the wrong shape.","path":"pstack/skills/arena/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/arena/SKILL.md","blobSha":"e908a7c6221cdb06d381b4621e265745955d4b2d","scope":"skill","types":["automation"]},{"id":"pstack:pstack/skills/automate-me/SKILL.md","name":"automate-me","description":"Use for \"automate me\", \"create/update/refresh my -mode skill\", \"turn/capture my preferences or working style into a skill\", or wanting agents to follow how the user works. Drafts or revises a personal -mode skill via create-skill + unslop, optionally pulling fresh evidence from recent transcripts.","path":"pstack/skills/automate-me/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/automate-me/SKILL.md","blobSha":"d22dd320f0638ea7adc90cee58a3a0fa6e07201f","scope":"skill","types":["skill-authoring"]},{"id":"pstack:pstack/skills/benchmark-checklist/SKILL.md","name":"benchmark-checklist","description":"Vet a perf measurement (limiter, tuning, limits, errors, repeatability, relevance, and whether the work happened) before you report or act on it. Use when you run a benchmark or report a speedup or regression you measured.","path":"pstack/skills/benchmark-checklist/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/benchmark-checklist/SKILL.md","blobSha":"88546fa684c003625a13d61b975ced97b8fcb90e","scope":"skill","types":["quality","research"]},{"id":"pstack:pstack/skills/blast-radius/SKILL.md","name":"blast-radius","description":"Find what a change could break somewhere else before it ships, beyond the diff, and prove the one fact it's safe because of by running real code instead of writing it up. Use for 'blast radius of X', 'what could this break', or reviewing a small diff you don't trust.","path":"pstack/skills/blast-radius/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/blast-radius/SKILL.md","blobSha":"1f5c95140597b8aa42fadf165e1aa0bca01639ff","scope":"skill","types":["quality","engineering"]},{"id":"pstack:pstack/skills/bro/SKILL.md","name":"bro","description":"Restate the last message in plain human language, with no jargon.","path":"pstack/skills/bro/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/bro/SKILL.md","blobSha":"b1701b778639c08bfc306291d70170c525c66a68","scope":"skill","types":["knowledge"]},{"id":"pstack:pstack/skills/correct/SKILL.md","name":"correct","description":"Find the mistakes agents keep repeating in this repo and make each one impossible. Try architecture first, then types, then a lint whose error names the fix, then a test, and write docs last. Prove each check fails on a real past mistake. Repeat this each time the operator corrects you. Use for /correct.","path":"pstack/skills/correct/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/correct/SKILL.md","blobSha":"c45e06f48a0982ae19f92c6e83a8cd05988097a3","scope":"skill","types":["engineering","quality"]},{"id":"pstack:pstack/skills/create-formal-verification-skill/SKILL.md","name":"create-formal-verification-skill","description":"Generate a project-local skill that formally verifies the code where a bug costs the most and tests reach the least, in any language, with whichever verification tool fits. Use for /create-formal-verification-skill, \"model-check this race\", \"prove this invariant\", or when concurrency, retries, state machines, parsers, or unsafe code need more than tests.","path":"pstack/skills/create-formal-verification-skill/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/create-formal-verification-skill/SKILL.md","blobSha":"92f7aa4fa966b857dd7fcc994b3c59650767c878","scope":"skill","types":["skill-authoring","quality"]},{"id":"pstack:pstack/skills/create-verification-skill/SKILL.md","name":"create-verification-skill","description":"Generate a project-local verification skill that drives your app the way a user does — any language, framework, or platform. Use for /create-verification-skill, \"make a control skill for this repo\", or when a project has no scripted way to prove UI/CLI/service behavior.","path":"pstack/skills/create-verification-skill/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/create-verification-skill/SKILL.md","blobSha":"140d033a001e8d27acd14b06004506c43053b199","scope":"skill","types":["skill-authoring","quality"]},{"id":"pstack:pstack/skills/figure-it-out/SKILL.md","name":"figure-it-out","description":"Design an auditable playbook when no narrower one fits: a large migration, an ambitious multi-part change, or work a human reviews after stepping away. Scales rigor to the task, runs a hypothesis loop, and logs decisions. Use for /figure-it-out or 'figure it out'.","path":"pstack/skills/figure-it-out/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/figure-it-out/SKILL.md","blobSha":"625a53c4d8be54dcca071952859aeaa1e0ccff9c","scope":"skill","types":["planning","automation"]},{"id":"pstack:pstack/skills/how/SKILL.md","name":"how","description":"Use for \"how does X work\", code walkthroughs before changing something, and placement / ownership / layering questions (\"where should this live\", \"which package owns this\", \"is this the right layer\"). Explains subsystem architecture, runtime flow, onboarding mental models. Use why for motivation.","path":"pstack/skills/how/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/how/SKILL.md","blobSha":"dbddbecf2a911a5216c3a611f20bf95db809a938","scope":"skill","types":["knowledge","engineering"]},{"id":"pstack:pstack/skills/in-your-own-words/SKILL.md","name":"in-your-own-words","description":"Restate in your own words what you think the user's goals are and what problem they're trying to solve. Use for /in-your-own-words.","path":"pstack/skills/in-your-own-words/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/in-your-own-words/SKILL.md","blobSha":"4b2a476a9017863032c8dba9d12f0a2026943292","scope":"skill","types":["knowledge","planning"]},{"id":"pstack:pstack/skills/interrogate/SKILL.md","name":"interrogate","description":"Use for \"interrogate\", \"adversarial review\", \"multi-model review\", \"challenge this\", \"stress test this code\", \"find blind spots\", or \"tear this apart\". Adversaries try to break a change or design, and only findings proven by a run survive.","path":"pstack/skills/interrogate/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/interrogate/SKILL.md","blobSha":"169f5b478f4cb53a4c5ab6046576034b4b07cfe8","scope":"skill","types":["quality"]},{"id":"pstack:pstack/skills/ketchup-video/SKILL.md","name":"ketchup-video","description":"Catch the user up like /ketchup, with a short subtitled video of slides for what happened and the waiting calls as text under it. Use for /ketchup-video.","path":"pstack/skills/ketchup-video/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/ketchup-video/SKILL.md","blobSha":"c0c614288dea9f413a418064d7e7d37791dd9e5e","scope":"skill","types":["knowledge","design"]},{"id":"pstack:pstack/skills/ketchup/SKILL.md","name":"ketchup","description":"Catch the user up on what changed in this chat since their last message, in plain words and small visuals. List every item waiting on them with what they need to decide it from the reply alone. Use for /ketchup.","path":"pstack/skills/ketchup/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/ketchup/SKILL.md","blobSha":"9eef27f92f8029137a7bfa7378305b075df9dc4f","scope":"skill","types":["knowledge"]},{"id":"pstack:pstack/skills/maintain-formal-verification-skill/SKILL.md","name":"maintain-formal-verification-skill","description":"Bring a project's formal verification back in line with the code after the code changes: find the commits that touched verified code, update the model, harness, or properties to describe the code as it is now, rerun, and say whether each failure is drift in the verification or a bug in the code. Use for /maintain-formal-verification-skill, \"is the model still true to the code\", or after merges and refactors that touched verified code without rechecking it.","path":"pstack/skills/maintain-formal-verification-skill/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/maintain-formal-verification-skill/SKILL.md","blobSha":"5d2f7f2228a3b771ca5b03124fc265ddfc53c5fc","scope":"skill","types":["quality","skill-authoring"]},{"id":"pstack:pstack/skills/maintain-verification-skill/SKILL.md","name":"maintain-verification-skill","description":"Periodic pass that keeps a project's verification skill and feature map honest: parallel source readers per feature, one live session driving every feature, at most one PR of proven corrections. Use for /maintain-verification-skill or \"audit the verify skill\".","path":"pstack/skills/maintain-verification-skill/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/maintain-verification-skill/SKILL.md","blobSha":"a2680b91fead45a0b4963d8c367a854956bea59d","scope":"skill","types":["quality","skill-authoring"]},{"id":"pstack:pstack/skills/make-bot-ui/SKILL.md","name":"make-bot-ui","description":"Use when building a custom UI (page, dashboard, buttons) that should wake a Grok Bot over a webhook, when the user must provide a webhook sender key, or when exposing that UI on Tailscale.","path":"pstack/skills/make-bot-ui/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/make-bot-ui/SKILL.md","blobSha":"446342ca35a46af771271e0cd901354a61997589","scope":"skill","types":["engineering","automation"]},{"id":"pstack:pstack/skills/no-comments/SKILL.md","name":"no-comments","description":"Spawn Comment Sicko, fix accepted findings, and offer encodings for claimed constraints.","path":"pstack/skills/no-comments/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/no-comments/SKILL.md","blobSha":"1789564454c627cb8d4ee8580822d7e368cef122","scope":"skill","types":["quality","engineering"]},{"id":"pstack:pstack/skills/poteto-help/SKILL.md","name":"poteto-help","description":"Guides users through pstack setup, /poteto-mode, and picking the skill, playbook, or principle for a task. Type /poteto-help with a question.","path":"pstack/skills/poteto-help/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/poteto-help/SKILL.md","blobSha":"77f1bd585bb44b1e14cb1dfc333bdf48c0815809","scope":"skill","types":["knowledge"]},{"id":"pstack:pstack/skills/poteto-mode/SKILL.md","name":"poteto-mode","description":"poteto's agent style for concise, detailed responses, deliberate subagents, unslopped prose, simple code, and verified work. Use for poteto, /poteto-mode, or requests to work in this style.","path":"pstack/skills/poteto-mode/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/poteto-mode/SKILL.md","blobSha":"82a1941713eb18905b93f7c5b2004664f6722898","scope":"skill","types":["knowledge","automation","quality"]},{"id":"pstack:pstack/skills/principle-attack-the-premise/SKILL.md","name":"principle-attack-the-premise","description":"Apply when two or more fixes that share one premise have failed the same gate. Write the premise down and test it directly before you write another fix that assumes it.","path":"pstack/skills/principle-attack-the-premise/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-attack-the-premise/SKILL.md","blobSha":"5ee25b02e701ca3e304122248a412d2372ab097c","scope":"skill","categoryHint":"Principles","types":["principles","quality"]},{"id":"pstack:pstack/skills/principle-boundary-discipline/SKILL.md","name":"principle-boundary-discipline","description":"Apply when wiring validation, error handling, or framework adapters. Concentrate guards at system boundaries (CLI, config, network, external APIs); trust internal types and keep business logic in pure functions.","path":"pstack/skills/principle-boundary-discipline/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-boundary-discipline/SKILL.md","blobSha":"95b2209ce7d15ddbca7c2bf6ef3626ffdc8d595e","scope":"skill","categoryHint":"Principles","types":["principles","engineering"]},{"id":"pstack:pstack/skills/principle-build-the-lever/SKILL.md","name":"principle-build-the-lever","description":"Apply to any non-trivial work, not just bulk work: edits, migrations, analyses, checks. Build the tool that does it or proves it (codemod, script, generator, or a skill your subagents follow) instead of working by hand. The tool is the artifact a reviewer can rerun.","path":"pstack/skills/principle-build-the-lever/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-build-the-lever/SKILL.md","blobSha":"8f9b5a931b10839ad5ef71ce43d5411c2c7a1f6b","scope":"skill","categoryHint":"Principles","types":["principles","automation"]},{"id":"pstack:pstack/skills/principle-encode-lessons-in-structure/SKILL.md","name":"principle-encode-lessons-in-structure","description":"Apply when you catch yourself writing the same instruction a second time, or notice a recurring correction. Encode the rule as a lint, metadata flag, runtime check, or script instead of more text.","path":"pstack/skills/principle-encode-lessons-in-structure/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-encode-lessons-in-structure/SKILL.md","blobSha":"4a96f77fe70e36cb030f9c5efa142f66877bf58a","scope":"skill","categoryHint":"Principles","types":["principles","engineering","quality"]},{"id":"pstack:pstack/skills/principle-exhaust-the-design-space/SKILL.md","name":"principle-exhaust-the-design-space","description":"Apply when facing a novel UI interaction or architectural decision with no precedent in the codebase. Build 2-3 competing prototypes and compare side by side before committing.","path":"pstack/skills/principle-exhaust-the-design-space/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-exhaust-the-design-space/SKILL.md","blobSha":"395a0839126bb231430a9c9da02ebab5422557d5","scope":"skill","categoryHint":"Principles","types":["principles","design","engineering"]},{"id":"pstack:pstack/skills/principle-experience-first/SKILL.md","name":"principle-experience-first","description":"Apply when product, UX, or feature-scope tradeoffs come up. Choose user delight over implementation convenience; ship fewer polished features over more rough ones.","path":"pstack/skills/principle-experience-first/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-experience-first/SKILL.md","blobSha":"5ea51741302cf3af4cc0b90ec70815bd3208dbf2","scope":"skill","categoryHint":"Principles","types":["principles","design"]},{"id":"pstack:pstack/skills/principle-explain-the-number/SKILL.md","name":"principle-explain-the-number","description":"Apply before you measure, and before you trust, report, or act on a number you measured: a speedup, a regression, a throughput, a latency, or an eval result. Find what limits it, and rule out that it measured something other than the work you think.","path":"pstack/skills/principle-explain-the-number/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-explain-the-number/SKILL.md","blobSha":"7ff00fcf8805872cfb500308ed2bdf5fdd5d6b8b","scope":"skill","categoryHint":"Principles","types":["principles","quality"]},{"id":"pstack:pstack/skills/principle-fix-root-causes/SKILL.md","name":"principle-fix-root-causes","description":"Apply when debugging. Trace each symptom back to the first place the system went wrong and fix it there. A guard is a fix only when the state it handles is legitimate.","path":"pstack/skills/principle-fix-root-causes/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-fix-root-causes/SKILL.md","blobSha":"b5e41168eb5944f583cf1d225e39552a48473dfe","scope":"skill","categoryHint":"Principles","types":["principles","quality"]},{"id":"pstack:pstack/skills/principle-foundational-thinking/SKILL.md","name":"principle-foundational-thinking","description":"Apply before writing logic: choosing core types and data structures, sequencing scaffold-vs-feature work, asking what concurrent actors share. Get the data structures right so downstream code becomes obvious.","path":"pstack/skills/principle-foundational-thinking/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-foundational-thinking/SKILL.md","blobSha":"4571b23e34a5037d44c152d966e37650450c9724","scope":"skill","categoryHint":"Principles","types":["principles","engineering"]},{"id":"pstack:pstack/skills/principle-guard-the-context-window/SKILL.md","name":"principle-guard-the-context-window","description":"Apply when context is filling up: large outputs, long files, repeated reads, fan-out planning. Route bulk to subagents; keep summaries in the main thread, not raw payloads.","path":"pstack/skills/principle-guard-the-context-window/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-guard-the-context-window/SKILL.md","blobSha":"0a1d3cfcf4539fe048887174000fecbf2fa40e81","scope":"skill","categoryHint":"Principles","types":["principles","automation"]},{"id":"pstack:pstack/skills/principle-laziness-protocol/SKILL.md","name":"principle-laziness-protocol","description":"Apply when refactoring, evaluating diff size, or tempted to add abstractions, layers, or signal threading. Bias toward deletion and the smallest change that solves the problem.","path":"pstack/skills/principle-laziness-protocol/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-laziness-protocol/SKILL.md","blobSha":"016c3c7c8dfffd995c1a02135a62248e6625879b","scope":"skill","categoryHint":"Principles","types":["principles","engineering"]},{"id":"pstack:pstack/skills/principle-make-operations-idempotent/SKILL.md","name":"principle-make-operations-idempotent","description":"Apply when designing commands, lifecycle steps, or processing loops that run amid crashes, restarts, and retries. Converge to the same end state regardless of partial prior runs.","path":"pstack/skills/principle-make-operations-idempotent/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-make-operations-idempotent/SKILL.md","blobSha":"7c61fe4b203bfae1de7db570af4c57fd0ba0a3d3","scope":"skill","categoryHint":"Principles","types":["principles","engineering"]},{"id":"pstack:pstack/skills/principle-migrate-callers-then-delete-legacy-apis/SKILL.md","name":"principle-migrate-callers-then-delete-legacy-apis","description":"Apply when introducing a new internal API while old callers still exist. Migrate callers and delete the old API in the same wave instead of preserving compatibility layers.","path":"pstack/skills/principle-migrate-callers-then-delete-legacy-apis/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-migrate-callers-then-delete-legacy-apis/SKILL.md","blobSha":"57ddd7b27d06ba4ee9e2d3811880476a18b88df6","scope":"skill","categoryHint":"Principles","types":["principles","engineering"]},{"id":"pstack:pstack/skills/principle-minimize-reader-load/SKILL.md","name":"principle-minimize-reader-load","description":"Apply when reviewing or shaping code that's hard to trace. Count layers between question and answer, and hidden state in the reader's head; collapse one-caller wrappers and shrink mutable scope.","path":"pstack/skills/principle-minimize-reader-load/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-minimize-reader-load/SKILL.md","blobSha":"19dd4876d6e92c04caa2729d37ac87ac126d20ed","scope":"skill","categoryHint":"Principles","types":["principles","engineering"]},{"id":"pstack:pstack/skills/principle-model-the-domain/SKILL.md","name":"principle-model-the-domain","description":"Apply when writing stateful logic, or when code branches a lot or repeats a shape assumption across files.","path":"pstack/skills/principle-model-the-domain/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-model-the-domain/SKILL.md","blobSha":"88ba012f47bd51b2db0758c657610d56f871e1ba","scope":"skill","categoryHint":"Principles","types":["principles","engineering"]},{"id":"pstack:pstack/skills/principle-never-block-on-the-human/SKILL.md","name":"principle-never-block-on-the-human","description":"Apply when tempted to ask 'should I do X?' on reversible work.","path":"pstack/skills/principle-never-block-on-the-human/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-never-block-on-the-human/SKILL.md","blobSha":"4f59bdc69f79d536b30b0014a563ed3be05b8b62","scope":"skill","categoryHint":"Principles","types":["principles","automation"]},{"id":"pstack:pstack/skills/principle-outcome-oriented-execution/SKILL.md","name":"principle-outcome-oriented-execution","description":"Apply during planned rewrites and migrations with explicit phase boundaries. Converge on the target architecture; don't preserve smooth intermediate states with throwaway compatibility code.","path":"pstack/skills/principle-outcome-oriented-execution/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-outcome-oriented-execution/SKILL.md","blobSha":"c49be0bc74783f0dee013101365ae09b2abb48a2","scope":"skill","categoryHint":"Principles","types":["principles","engineering"]},{"id":"pstack:pstack/skills/principle-prove-it-works/SKILL.md","name":"principle-prove-it-works","description":"Apply after completing a task, before declaring done. Verify against the real artifact (run the feature, read the actual value, inspect the diff), not a proxy, self-report, or 'it compiles.'","path":"pstack/skills/principle-prove-it-works/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-prove-it-works/SKILL.md","blobSha":"1c293b3c3ad0f7cb021858b17e7588d30a0a1acb","scope":"skill","categoryHint":"Principles","types":["principles","quality"]},{"id":"pstack:pstack/skills/principle-redesign-from-first-principles/SKILL.md","name":"principle-redesign-from-first-principles","description":"Apply when integrating a new requirement into an existing design.","path":"pstack/skills/principle-redesign-from-first-principles/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-redesign-from-first-principles/SKILL.md","blobSha":"5ca5246cbb0fa08884ce17b0d22c117ae1ad67b8","scope":"skill","categoryHint":"Principles","types":["principles","engineering"]},{"id":"pstack:pstack/skills/principle-separate-before-serializing-shared-state/SKILL.md","name":"principle-separate-before-serializing-shared-state","description":"Apply when concurrent actors might write to the same file, branch, key, or state object. Eliminate the sharing first; serialize structurally only when one shared writer is a real invariant.","path":"pstack/skills/principle-separate-before-serializing-shared-state/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-separate-before-serializing-shared-state/SKILL.md","blobSha":"6a4c3b876b694097a12003996588f557d2b55d0e","scope":"skill","categoryHint":"Principles","types":["principles","engineering"]},{"id":"pstack:pstack/skills/principle-sequence-verifiable-units/SKILL.md","name":"principle-sequence-verifiable-units","description":"Apply to multi-step work (sweeps, migrations, runs of similar edits) and to how you stack commits and PRs. Break work into small units that each end in a verifiable state, check each before the next, and order delivery so the sequence proves itself to a reviewer.","path":"pstack/skills/principle-sequence-verifiable-units/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-sequence-verifiable-units/SKILL.md","blobSha":"3998185a29f287f6f30f0909c98ac4e2af5ddb97","scope":"skill","categoryHint":"Principles","types":["principles","planning","quality"]},{"id":"pstack:pstack/skills/principle-subtract-before-you-add/SKILL.md","name":"principle-subtract-before-you-add","description":"Apply when sequencing an addition, refactor, or rewrite. Remove dead code, redundant validators, and stub references first, then build on the simpler base.","path":"pstack/skills/principle-subtract-before-you-add/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-subtract-before-you-add/SKILL.md","blobSha":"b8740ba6f06922d8e7ef3b23f9fb16e0fc4a876f","scope":"skill","categoryHint":"Principles","types":["principles","engineering"]},{"id":"pstack:pstack/skills/principle-test-behavior-not-implementation/SKILL.md","name":"principle-test-behavior-not-implementation","description":"Apply when you write, change, or keep a test. Assert what the code's users can observe, so that the test fails when that behavior breaks and keeps passing when only the internals change.","path":"pstack/skills/principle-test-behavior-not-implementation/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-test-behavior-not-implementation/SKILL.md","blobSha":"094b9427aa64294afd64d83e9495a5ee303631e0","scope":"skill","categoryHint":"Principles","types":["principles","quality"]},{"id":"pstack:pstack/skills/principle-type-system-discipline/SKILL.md","name":"principle-type-system-discipline","description":"Apply when designing types, reviewing a function signature, or writing code in any statically-typed language. Make illegal states unrepresentable, brand semantic primitives, parse external data at boundaries, exhaust variants, derive from authoritative schemas.","path":"pstack/skills/principle-type-system-discipline/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/principle-type-system-discipline/SKILL.md","blobSha":"852aab0340246c0d0dfd59ea6be962ce40a31272","scope":"skill","categoryHint":"Principles","types":["principles","engineering"]},{"id":"pstack:pstack/skills/recall/SKILL.md","name":"recall","description":"Reconstruct your recent working context from your own chat history, live state, and the shared record (user reports, prior fixes, incidents), then hand back a tight current-state brief. Use for 'recall my work on X', 'catch me up', 'what have I been working on', 'where did I leave off', before starting or resuming work.","path":"pstack/skills/recall/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/recall/SKILL.md","blobSha":"a4ce69d2516715d7205867072d3e00d399fb3419","scope":"skill","types":["knowledge"]},{"id":"pstack:pstack/skills/reflect/SKILL.md","name":"reflect","description":"Mine the active transcript for durable learnings and route each to a concrete edit on an existing skill. Use when the user says reflect.","path":"pstack/skills/reflect/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/reflect/SKILL.md","blobSha":"e7bcc3aa18174a4103fdafdf947c8098cc0d8e16","scope":"skill","types":["skill-authoring"]},{"id":"pstack:pstack/skills/setup-pstack/SKILL.md","name":"setup-pstack","description":"Configure which models pstack uses per role and at what reasoning budget. Detects your available models and writes an always-applied rule that overrides the skill defaults. Use for /setup-pstack, \"configure pstack models\", \"pstack budget\", or changing pstack's model choices.","path":"pstack/skills/setup-pstack/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/setup-pstack/SKILL.md","blobSha":"7358536071ed21b257da26adc1aec452c3d46466","scope":"skill","types":["automation"]},{"id":"pstack:pstack/skills/sharpen/SKILL.md","name":"sharpen","description":"Make a task deeper, not bigger, then rewrite the prompt. Use for /sharpen.","path":"pstack/skills/sharpen/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/sharpen/SKILL.md","blobSha":"2a03402b704012a626e9351b4db9c05cfd3afd20","scope":"skill","types":["planning","knowledge"]},{"id":"pstack:pstack/skills/show-me-your-work/SKILL.md","name":"show-me-your-work","description":"Keep a reviewable decision trail for long-running or unattended work: a TSV log with one row per decision (what, why, evidence, result). Local by default; commit it when a reviewer needs the trail to trust the result. Use for /show-me-your-work, autonomous or multi-phase runs, or work a human reviews after stepping away.","path":"pstack/skills/show-me-your-work/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/show-me-your-work/SKILL.md","blobSha":"bf64d5de06efce56152c4a6030a084213c69b228","scope":"skill","types":["documents","knowledge"]},{"id":"pstack:pstack/skills/statechart/SKILL.md","name":"statechart","description":"Check a TLA+ model of a system that moves between states, such as a product flow, a protocol, or a service, and draw it as a Mermaid statechart. The report gives the shortest path to each state that breaks a rule. Use for /statechart, or to show a bug as a path through states.","path":"pstack/skills/statechart/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/statechart/SKILL.md","blobSha":"18d653a810dfbb3ea35a6ed88bcfe8cb84f0a893","scope":"skill","types":["quality","engineering"]},{"id":"pstack:pstack/skills/swarm/SKILL.md","name":"swarm","description":"Fan out N parallel workers, drain them, and return one report. Use for /swarm, 'swarm this', or parallel coverage, races, gauntlets, and exploration.","path":"pstack/skills/swarm/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/swarm/SKILL.md","blobSha":"cf1deb77e2c7b83f9bda0551430ea166bf062977","scope":"skill","types":["automation"]},{"id":"pstack:pstack/skills/tdd/SKILL.md","name":"tdd","description":"Use only when the user explicitly asks for TDD, a failing test, or a regression test, OR when the bug has an obvious cheap local test target. Skip when the test path is unclear, expensive, integration-heavy, or not requested.","path":"pstack/skills/tdd/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/tdd/SKILL.md","blobSha":"ca6f24c963001d9d518db2936dfe3d12f29b4e94","scope":"skill","types":["quality","engineering"]},{"id":"pstack:pstack/skills/teach/SKILL.md","name":"teach","description":"Explain a body of work plainly so a person actually understands it. Runs the `how` and `why` skills and weaves what they find into one clear explanation. Use for 'teach me this', 'help me really understand X', 'explain this change or subsystem to me'.","path":"pstack/skills/teach/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/teach/SKILL.md","blobSha":"6146b65c4543af52c2693e844fc0ac4e4c010fae","scope":"skill","types":["knowledge"]},{"id":"pstack:pstack/skills/technical-writing/SKILL.md","name":"technical-writing","description":"Layered technical-writing standard: Diátaxis structure, Google developer style sentences, STE instruction rules, Global English syntax. Use for /technical-writing or when writing or reviewing docs, RFCs, readmes, PR descriptions, or commit messages.","path":"pstack/skills/technical-writing/SKILL.md","url":"https://github.com/cursor/plugins/blob/aaeb0ea3a0584995aa8f55ce44c6c5259414b896/pstack/skills/technical-writing/SKILL.md","blobSha":"6f53776d935064370738bebe79f9fc8f39987ade","scope":"skill","types":["documents","knowledge"]},{"id":"pstack:pstack/skills/typescript-best-practices/SKILL.md","name" let selectedTheme='fwd',selectedMode='system';
const systemAppearance=matchMedia('(prefers-color-scheme: dark)');
function applyAppearance(){
 const theme=appearanceThemes.find(t=>t.id===selectedTheme);
 const html=document.documentElement;
 const dark=selectedMode==='dark'||(selectedMode==='system'&&systemAppearance.matches);
 html.classList.toggle('dark',dark);html.classList.toggle('light',!dark);
 html.classList.toggle('theme-dark',dark);html.classList.toggle('theme-light',!dark);
 html.style.colorScheme=dark?'dark':'light';
 for(const attr of Array.from(html.attributes))if(attr.name==='data-theme'||attr.name.startsWith('data-theme-option-'))html.removeAttribute(attr.name);
 if(theme.id!=='default')html.dataset.theme=theme.id;
 for(const [name,value] of Object.entries(theme.attributes))if(value!==null)html.setAttribute(name,value);
 const declarations=mode=>Object.entries(theme.variables[mode]).map(([name,value])=>name+':'+value+';').join('');
 document.getElementById('workpal-theme').textContent=theme.css+'\n:root.theme-light{'+declarations('light')+'}\n:root.theme-dark{'+declarations('dark')+'}';
}
function decorateComponents(){
 root.querySelectorAll('button').forEach(b=>{
  b.dataset.slot='button';
  b.dataset.variant=b.classList.contains('primary')?'default':b.classList.contains('plain')?'outline':'ghost';
  b.dataset.size='sm';
 });
 root.querySelectorAll('.nav button').forEach(b=>{b.dataset.mc='nav-item';b.dataset.active=String(b.getAttribute('aria-current')==='page');});
 root.querySelectorAll('.panel,.squad-card,.skill-card').forEach(n=>n.dataset.slot='card');
 root.querySelectorAll('input').forEach(n=>n.dataset.slot='input');
 root.querySelectorAll('select').forEach(n=>n.dataset.slot='select-trigger');
}
root.addEventListener('change',event=>{
 if(event.target.id==='appearance-theme'){selectedTheme=event.target.value;applyAppearance();}
 if(event.target.id==='appearance-mode'){selectedMode=event.target.value;applyAppearance();}
});
root.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&event.target.closest('.appearance-menu')){
  const menu=root.querySelector('.appearance-menu');menu.open=false;menu.querySelector('summary').focus();
 }
});
root.addEventListener('pointerdown',event=>{
 const menu=root.querySelector('.appearance-menu');
 if(menu.open&&!menu.contains(event.target))menu.open=false;
});
systemAppearance.addEventListener('change',()=>{if(selectedMode==='system')applyAppearance();});
applyAppearance();

 root.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;let restore=null,openDetail=false,closeDetail=false,teamFocus=null,returnToTeam=false;
 if(b.dataset.nav){current=b.dataset.nav;}
 else if(b.dataset.chartStage){stage=Number(b.dataset.chartStage);teamFocus='.stage-detail h2';}
 else if(b.dataset.chartType){typeFilter=b.dataset.chartType;filter='All';query='';limit=12;selectedSkill=null;teamFocus='#skill-type';}
 else if(b.dataset.stage){stage=Number(b.dataset.stage);restore=['stage',String(stage)];}
 else if(b.dataset.filter){filter=b.dataset.filter;selectedSkill=null;limit=12;restore=['filter',filter];}
 else if(b.dataset.skill){selectedSkill=b.dataset.skill;openDetail=true;}
 else if(b.dataset.closeSkill){restore=['skill',selectedSkill];selectedSkill=null;closeDetail=true;}
 else if(b.dataset.squad||b.dataset.chartSquad){squad=b.dataset.squad||b.dataset.chartSquad;squadOriginKind=b.dataset.chartSquad?'chartSquad':'squad';agent=null;roleOrigin=null;teamFocus='#squad-title';}
 else if(b.dataset.squadBack){restore=[squadOriginKind,squad];squad=null;agent=null;roleOrigin=null;returnToTeam=true;}
 else if(b.dataset.roleBack){restore=[roleOriginKind,roleOrigin||agent];agent=null;roleOrigin=null;returnToTeam=true;}
 else if(b.dataset.agent||b.dataset.chartAgent){agent=b.dataset.agent||b.dataset.chartAgent;roleOrigin=agent;roleOriginKind=b.dataset.chartAgent?'chartAgent':'agent';teamFocus='#agent-title';}
 else if(b.dataset.relatedAgent){agent=b.dataset.relatedAgent;teamFocus='#agent-title';}
 else if(b.dataset.openSkill){selectedSkill=b.dataset.openSkill;current='skills';filter='All';typeFilter='All';query='';limit=12;openDetail=true;}

 }
